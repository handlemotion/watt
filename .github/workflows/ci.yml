name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node.js
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Node.js checks
        run: pnpm check

  desktop:
    name: Desktop
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust checks
        run: pnpm check:rust

      - name: Exercise packaged sidecar
        run: |
          file apps/desktop/src-tauri/binaries/watt-desktop-sidecar-aarch64-apple-darwin | grep 'arm64'
          pnpm desktop:sidecar:smoke

      - name: Build ad-hoc-signed application
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cd apps/desktop && ../../node_modules/.bin/tauri build --target aarch64-apple-darwin --bundles app

      - name: Verify packaged application
        run: |
          app='apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Watt.app'
          sidecar="$app/Contents/MacOS/watt-desktop-sidecar"
          test -d "$app"
          test -x "$sidecar"
          file "$sidecar" | grep 'arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
