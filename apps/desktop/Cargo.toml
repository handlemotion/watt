[package]
name = "watt-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "watt_desktop"
crate-type = ["rlib"]

[dependencies]
directories = "6.0.0"
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
jsonschema = { version = "0.33.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
ulid = "1.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
