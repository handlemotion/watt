[package]
name = "watt-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "watt_desktop_bridge"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
jsonschema = { version = "0.33.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-shell = "2.3.5"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
ulid = "1.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
