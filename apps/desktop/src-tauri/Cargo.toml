[package]
name = "watt-desktop"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
name = "watt_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "watt-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
directories = "6.0.0"
jsonschema = { version = "0.33.0", default-features = false }
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
ulid = "1.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
] }

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
