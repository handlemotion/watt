[package]
name = "watt-desktop-bridge"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
jsonschema = { version = "0.33.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "rt", "sync"] }
ulid = "1.2"

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
